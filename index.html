<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documento</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">
  <style>
    :root {
      /* Tonos exactos de la imagen de referencia */
      --fondo-pagina: #eceef1;
      --fondo-tarjeta: #fafad2;
      --radio-esquinas: 32px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--fondo-pagina);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 14px;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .tarjeta-pdf {
      background-color: var(--fondo-tarjeta);
      border-radius: var(--radio-esquinas);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      width: 100%;
      max-width: 480px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px;
    }

    .pagina-contenedor {
      position: relative;
      width: 100%;
      margin-bottom: 12px;
      border-radius: calc(var(--radio-esquinas) - 12px);
      overflow: hidden;
      background-color: var(--fondo-tarjeta);
    }

    .pagina-contenedor:last-child {
      margin-bottom: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      /* Hace que si el PDF tiene fondo blanco, se fusione con el tono crema de la tarjeta */
      mix-blend-mode: multiply;
    }

    .textLayer {
      opacity: 1;
      mix-blend-mode: multiply;
    }

    .textLayer ::selection {
      background: rgba(0, 123, 255, 0.3);
    }
  </style>
</head>
<body>

  <div class="tarjeta-pdf" id="visor-pdf"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    const urlPdf = 'imagen.pdf';

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const contenedorPrincipal = document.getElementById('visor-pdf');

    async function renderizarPDF() {
      const pdf = await pdfjsLib.getDocument(urlPdf).promise;

      for (let numPagina = 1; numPagina <= pdf.numPages; numPagina++) {
        const pagina = await pdf.getPage(numPagina);
        const viewportOriginal = pagina.getViewport({ scale: 2 });

        const divPagina = document.createElement('div');
        divPagina.className = 'pagina-contenedor';
        contenedorPrincipal.appendChild(divPagina);

        const canvas = document.createElement('canvas');
        const contexto = canvas.getContext('2d');
        canvas.width = viewportOriginal.width;
        canvas.height = viewportOriginal.height;
        divPagina.appendChild(canvas);

        await pagina.render({
          canvasContext: contexto,
          viewport: viewportOriginal
        }).promise;

        const divTexto = document.createElement('div');
        divTexto.className = 'textLayer';
        divPagina.appendChild(divTexto);

        const escalaPantalla = divPagina.clientWidth / viewportOriginal.width;
        const viewportTexto = pagina.getViewport({ scale: 2 * escalaPantalla });
        divTexto.style.setProperty('--scale-factor', 2 * escalaPantalla);

        const contenidoTexto = await pagina.getTextContent();
        pdfjsLib.renderTextLayer({
          textContentSource: contenidoTexto,
          container: divTexto,
          viewport: viewportTexto,
          textDivs: []
        });
      }
    }

    renderizarPDF().catch(err => {
      contenedorPrincipal.innerHTML = '<p style="padding:20px;color:#b00;">No se pudo cargar imagen.pdf. Verifica que el archivo esté subido en el mismo repositorio.</p>';
      console.error(err);
    });
  </script>
</body>
</html>
